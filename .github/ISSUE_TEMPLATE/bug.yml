name: Bug report
description: Report a reproducible SyncMe problem.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behaviour. Remove credentials and private messages from attachments.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and build source
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model and Android version
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots and test evidence
