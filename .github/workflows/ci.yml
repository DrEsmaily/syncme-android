name: CI
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: build
            tasks: ':app:assembleGplayDebug'
          - check: unit-tests
            tasks: ':app:testGplayDebugUnitTest testDebugUnitTest'
          - check: lint
            tasks: ':app:lintGplayDebug lintDebug ktlintCheck detekt'
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
    steps:
      - name: Select unit-test LFS fixtures
        if: matrix.check == 'unit-tests'
        run: git config --global lfs.fetchinclude 'libraries/mediaupload/impl/src/test/assets/*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: ${{ matrix.check == 'unit-tests' }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run checks
        run: ./gradlew ${{ matrix.tasks }} --no-configuration-cache --stacktrace --max-workers=2 --no-parallel --continue
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reports-${{ matrix.check }}
          path: '**/build/reports/'
          retention-days: 14
          if-no-files-found: ignore
      - name: Verify test APK identity and record provenance
        if: matrix.check == 'build'
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/gplay/debug/app-gplay-universal-debug.apk
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p build/provenance
          "$tools_dir/aapt" dump badging "$apk" > build/provenance/manifest.txt
          grep -F "package: name='com.github.dresmaily.syncme.debug'" build/provenance/manifest.txt
          "$tools_dir/apksigner" verify --verbose --print-certs "$apk" > build/provenance/signature.txt
          sha256sum "$apk" > build/provenance/SHA256SUMS
          git rev-parse HEAD > build/provenance/commit.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > build/provenance/ci-run.txt
      - name: Upload test APK
        if: matrix.check == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/gplay/debug/*-universal-debug.apk
            build/provenance/
          retention-days: 14
          if-no-files-found: error
